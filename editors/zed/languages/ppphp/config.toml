name = "++PHP"
grammar = "ppphp"
path_suffixes = ["ppphp"]
line_comments = ["// ", "# "]
block_comment = { start = "/*", end = "*/", prefix = "* ", tab_size = 1 }
tab_size = 4
hard_tabs = false
word_characters = ["$"]
completion_query_characters = ["$"]
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true, not_in = ["string", "comment"] },
    { start = "[", end = "]", close = true, newline = true, not_in = ["string", "comment"] },
    { start = "(", end = ")", close = true, newline = true, not_in = ["string", "comment"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
